<svg xmlns="http://www.w3.org/2000/svg" width="560" height="290" viewBox="0 0 560 290" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .7s; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    .f1 { animation-delay: 1.2s; } .f2 { animation-delay: 1.4s; } .f3 { animation-delay: 1.6s; } .f4 { animation-delay: 2.4s; }
    .ring { fill: none; stroke-width: 7; stroke-linecap: round; transform: rotate(-90deg); transform-box: fill-box; transform-origin: center; }
    .r1 { stroke-dasharray: 188.5; stroke-dashoffset: 188.5; animation: r1 1.8s cubic-bezier(.22,1,.36,1) 1s forwards; }
    .r2 { stroke-dasharray: 188.5; stroke-dashoffset: 188.5; animation: r2 1.8s cubic-bezier(.22,1,.36,1) 1.2s forwards; }
    .glow { animation: glow 2.4s ease-in-out 2.6s infinite; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes r1 { to { stroke-dashoffset: 55.0; } }
    @keyframes r2 { to { stroke-dashoffset: 10.7; } }
    @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#1A7F37"/>
      <stop offset="1" stop-color="#39D353"/>
    </linearGradient>
  </defs>

  <rect x=".5" y=".5" width="559" height="289" rx="12" fill="#0D1117" stroke="#30363D"/>

  <text x="24" y="38" fill="#E6EDF3" font-size="17" font-weight="700">Compute cost</text>
  <text x="146" y="38" fill="#8B949E" font-size="14">GFLOPs at 384×384, lower is better</text>

  <text x="24" y="80" fill="#8B949E" font-size="14">C-Tran + ResNet152d</text>
  <rect class="grow d1" x="196" y="67" width="290" height="17" rx="4" fill="#30363D"/>
  <text class="fade f1" x="496" y="81" fill="#8B949E" font-size="14">≈8×</text>

  <text x="24" y="116" fill="#8B949E" font-size="14">C-Tran + DenseNet201</text>
  <rect class="grow d2" x="196" y="103" width="105" height="17" rx="4" fill="#30363D"/>
  <text class="fade f2" x="311" y="117" fill="#8B949E" font-size="14">≈3×</text>

  <text x="24" y="152" fill="#E6EDF3" font-size="14" font-weight="700">CoLaRT</text>
  <g class="glow"><rect class="grow d3" x="196" y="139" width="35" height="17" rx="4" fill="url(#g)"/></g>
  <text class="fade f3" x="241" y="153" fill="#39D353" font-size="14" font-weight="700">1×  ·  67% to 88% fewer GFLOPs</text>

  <line x1="24" y1="180" x2="536" y2="180" stroke="#21262D"/>

  <g transform="translate(62 234)">
    <circle r="30" fill="none" stroke="#21262D" stroke-width="7"/>
    <circle class="ring r1" r="30" stroke="url(#g)"/>
    <text class="fade f2" y="6" text-anchor="middle" fill="#E6EDF3" font-size="16" font-weight="700">0.708</text>
    <text x="44" y="6" fill="#8B949E" font-size="14" letter-spacing="1">mAP</text>
  </g>

  <g transform="translate(206 234)">
    <circle r="30" fill="none" stroke="#21262D" stroke-width="7"/>
    <circle class="ring r2" r="30" stroke="url(#g)"/>
    <text class="fade f3" y="6" text-anchor="middle" fill="#E6EDF3" font-size="16" font-weight="700">0.943</text>
    <text x="44" y="6" fill="#8B949E" font-size="14" letter-spacing="1">AUC</text>
  </g>

  <g class="fade f4" transform="translate(340 214)">
    <text fill="#E6EDF3" font-size="14.5" font-weight="700">MuReD</text>
    <text y="22" fill="#8B949E" font-size="13.5">Pico + Atto ensemble</text>
    <text y="43" fill="#8B949E" font-size="13.5">3-seed mean, 512×512</text>
  </g>
</svg>
