<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .grow { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1.4s cubic-bezier(.22,1,.36,1) forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .45s; } .d3 { animation-delay: .7s; }
    .fade { opacity: 0; animation: fade .6s ease forwards; }
    .f1 { animation-delay: 1.2s; } .f2 { animation-delay: 1.4s; } .f3 { animation-delay: 1.6s; } .f4 { animation-delay: 2.4s; }
    .ring { fill: none; stroke-width: 7; stroke-linecap: round; transform: rotate(-90deg); transform-box: fill-box; transform-origin: center; }
    .r1 { stroke-dasharray: 213.6; stroke-dashoffset: 213.6; animation: r1 1.8s cubic-bezier(.22,1,.36,1) 1s forwards; }
    .r2 { stroke-dasharray: 213.6; stroke-dashoffset: 213.6; animation: r2 1.8s cubic-bezier(.22,1,.36,1) 1.2s forwards; }
    .glow { animation: glow 2.4s ease-in-out 2.6s infinite; }
    @keyframes grow { to { transform: scaleX(1); } }
    @keyframes fade { to { opacity: 1; } }
    @keyframes r1 { to { stroke-dashoffset: 62.4; } }
    @keyframes r2 { to { stroke-dashoffset: 12.2; } }
    @keyframes glow { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#1A7F37"/>
      <stop offset="1" stop-color="#39D353"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" rx="14" fill="#0D1117" stroke="#30363D"/>

  <text x="28" y="42" fill="#E6EDF3" font-size="17" font-weight="700">Compute cost</text>
  <text x="152" y="42" fill="#8B949E" font-size="13">GFLOPs at 384×384, lower is better</text>

  <!-- rows -->
  <text x="28" y="92" fill="#8B949E" font-size="13">C-Tran + ResNet152d</text>
  <rect class="grow d1" x="200" y="77" width="360" height="22" rx="5" fill="#30363D"/>
  <text class="fade f1" x="570" y="93" fill="#8B949E" font-size="13">≈8×</text>

  <text x="28" y="140" fill="#8B949E" font-size="13">C-Tran + DenseNet201</text>
  <rect class="grow d2" x="200" y="125" width="131" height="22" rx="5" fill="#30363D"/>
  <text class="fade f2" x="341" y="141" fill="#8B949E" font-size="13">≈3×</text>

  <text x="28" y="188" fill="#E6EDF3" font-size="13" font-weight="700">CoLaRT</text>
  <g class="glow"><rect class="grow d3" x="200" y="173" width="43" height="22" rx="5" fill="url(#g)"/></g>
  <text class="fade f3" x="253" y="189" fill="#39D353" font-size="13" font-weight="700">1×  ·  67% to 88% fewer GFLOPs</text>

  <line x1="28" y1="228" x2="612" y2="228" stroke="#21262D"/>

  <!-- metrics -->
  <g transform="translate(110 305)">
    <circle r="34" fill="none" stroke="#21262D" stroke-width="7"/>
    <circle class="ring r1" r="34" stroke="url(#g)"/>
    <text class="fade f2" y="6" text-anchor="middle" fill="#E6EDF3" font-size="17" font-weight="700">0.708</text>
    <text y="62" text-anchor="middle" fill="#8B949E" font-size="13" letter-spacing="1">mAP</text>
  </g>

  <g transform="translate(270 305)">
    <circle r="34" fill="none" stroke="#21262D" stroke-width="7"/>
    <circle class="ring r2" r="34" stroke="url(#g)"/>
    <text class="fade f3" y="6" text-anchor="middle" fill="#E6EDF3" font-size="17" font-weight="700">0.943</text>
    <text y="62" text-anchor="middle" fill="#8B949E" font-size="13" letter-spacing="1">AUC</text>
  </g>

  <g class="fade f4" transform="translate(370 270)">
    <text fill="#E6EDF3" font-size="14" font-weight="700">MuReD dataset</text>
    <text y="24" fill="#8B949E" font-size="13">Pico + Atto ensemble</text>
    <text y="46" fill="#8B949E" font-size="13">3-seed mean, 512×512</text>
    <text y="68" fill="#8B949E" font-size="13">Submitted to IEEE ICPRS 2027</text>
  </g>
</svg>
